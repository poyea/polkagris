[project]
name = "polkagris"
version = "0.1.0"
description = "polkagris machines"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
kernels = ["triton>=3.0; sys_platform == 'linux'"]
serving = ["vllm>=0.8; sys_platform == 'linux'"]
post = ["transformers>=4.45"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polkagris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001"]
